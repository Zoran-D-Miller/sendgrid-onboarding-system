  <!-- ============================================================
       SHARED MODULE: head
       Meta tags + the only <style> block in the email.
       Base styles are INLINE on every element. This <style> block holds
       only what cannot be inlined: media queries and dark mode. If a
       client strips it (some Gmail app/account combos do), the email
       still renders as a fluid single column at up to 600px.
       ============================================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Stop iOS Mail from auto-scaling text and linking dates/addresses. -->
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <!-- Tell clients we ship our own dark-mode styles, so they do not force-invert. -->
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset client quirks that inline styles cannot reach. */
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }

    /* Mobile: below 600px the container is already 100% wide (fluid),
       so here we only tighten padding, scale the heading and stack buttons. */
    @media only screen and (max-width: 600px) {
      .px { padding-left: 24px !important; padding-right: 24px !important; }
      .h1 { font-size: 26px !important; line-height: 32px !important; }
      .btn-table { width: 100% !important; }
      .btn-link { display: block !important; text-align: center !important; }
      .stack { display: block !important; width: 100% !important; }
    }

    /* Dark mode (Apple Mail, iOS Mail, Outlook.com honour this). */
    @media (prefers-color-scheme: dark) {
      .bg-page { background-color: #111318 !important; }
      .bg-card { background-color: #1C1F26 !important; }
      .text-strong { color: #F3F4F6 !important; }
      .text-body { color: #D1D5DB !important; }
      .text-muted { color: #9CA3AF !important; }
      .border { border-color: #2D313A !important; }
    }
  </style>
